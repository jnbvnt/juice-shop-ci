name: CI/CD Security Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  security-events: write

jobs:
  # ─── PHASE 1 : BUILD ───────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Build frontend
        run: npm run build 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: frontend/dist/
          if-no-files-found: ignore

  # ─── PHASE 2 : TESTS ───────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test 2>&1 | tee test-results.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

  # ─── PHASE 3 : SECRET SCAN ─────────────────────────────────────
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: gitleaks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore



  # ─── PHASE 4 : SAST ────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif \
            . || true
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore


  # ─── PHASE 5 : SCA (dépendances) ───────────────────────────────
  sca:
    name: Dependency Check (npm audit + OWASP DC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
  
      - name: npm audit
        run: npm audit --json > npm-audit.json 2>&1 || true
  
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'juice-shop-ci'
          path: '.'
          format: 'HTML,JSON'
          out: 'dependency-check-report'
          args: --enableRetired
        continue-on-error: true
  
      - name: Quality gate — npm audit
        run: |
          CRITICAL=$(cat npm-audit.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          v=d.get('metadata',{}).get('vulnerabilities',{})
          print(v.get('critical',0))
          ")
          HIGH=$(cat npm-audit.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          v=d.get('metadata',{}).get('vulnerabilities',{})
          print(v.get('high',0))
          ")
          echo "Critical: $CRITICAL | High: $HIGH"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "GATE FAILED: $CRITICAL critical vulnerabilities"
            exit 1
          fi
  
      - uses: actions/upload-artifact@v4    # ← un seul upload, après la quality gate
        if: always()
        with:
          name: sca-reports
          path: |
            npm-audit.json
            dependency-check-report/
  # ─── PHASE 6 : BUILD IMAGE DOCKER ──────────────────────────────
  docker-build:
    name: Docker Build & Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [ build, test ]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t juice-shop:${{ github.sha }} .

      - name: Run Trivy (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop:${{ github.sha }}'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'          # ← ne pas échouer ici
          ignore-unfixed: true

      - name: Run Trivy (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-report.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'          # ← ne pas échouer ici non plus
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-report.sarif
          category: trivy

      - name: Quality gate — Trivy
        run: |
          CRITICAL=$(python3 -c "
          import json
          d=json.load(open('trivy-report.json'))
          total=sum(1 for r in d.get('Results',[]) for v in r.get('Vulnerabilities',[]) if v.get('Severity')=='CRITICAL')
          print(total)
          ")
          echo "Critical CVEs found: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ GATE FAILED: $CRITICAL critical CVEs in container image"
            exit 1
          fi
          echo "✅ No critical CVEs found"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Save Docker image
        if: always()
        run: docker save juice-shop:${{ github.sha }} | gzip > juice-shop.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-image
          path: juice-shop.tar.gz

  # ─── PHASE 7 : DEPLOY EN ENVIRONNEMENT DE TEST ─────────────────
  deploy-test:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest
    needs: docker-build
    outputs:
      app-url: http://localhost:3000
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load < juice-shop.tar.gz
      - name: Start application
        run: |
          docker run -d \
            --name juice-shop-test \
            -p 3000:3000 \
            juice-shop:${{ github.sha }}
          echo "Waiting for app to start..."
          sleep 30
          curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3000 -o /dev/null -s -w "%{http_code}"

  # ─── PHASE 8 : DAST (ZAP) ──────────────────────────────────────
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: deploy-test
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
  
      - name: Load and start application
        run: |
          docker load < juice-shop.tar.gz
          docker run -d --name juice-shop-dast -p 3000:3000 juice-shop:${{ github.sha }}
          echo "Waiting for app to start..."
          sleep 40
          curl --retry 15 --retry-delay 5 --retry-connrefused \
            http://localhost:3000 -o /dev/null -s -w "HTTP %{http_code}\n"
  
      - name: Get JWT token (authentication)
        id: auth
        run: |
          TOKEN=$(curl -s -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@juice-sh.op","password":"admin123"}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['authentication']['token'])")
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "Token obtained: ${TOKEN:0:20}..."
  
      - name: Create ZAP context with auth
        run: |
          mkdir -p .zap
          cat > .zap/juice-shop.context << 'EOF'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <configuration>
            <context>
              <name>Juice Shop</name>
              <desc/>
              <inscope>true</inscope>
              <incregexes>http://localhost:3000.*</incregexes>
              <tech>
                <include>Db</include>
                <include>Language</include>
                <include>OS</include>
                <include>WS</include>
              </tech>
              <users/>
              <forcedUser>-1</forcedUser>
              <session class="org.zaproxy.zap.extension.httpsessions.HttpSessionsSite"/>
              <authentication class="org.zaproxy.zap.extension.authentication.AuthenticationMethodType$ManualAuthenticationMethod">
                <loggedin>basket</loggedin>
                <loggedout>login</loggedout>
              </authentication>
            </context>
          </configuration>
          EOF
  
      - name: ZAP authenticated baseline scan
        run: |
          docker run --rm \
            --network host \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:3000 \
              -r /zap/wrk/zap-report.html \
              -J /zap/wrk/zap-report.json \
              -w /zap/wrk/zap-report.md \
              -z "-config replacer.full_list(0).description=auth \
                  -config replacer.full_list(0).enabled=true \
                  -config replacer.full_list(0).matchtype=REQ_HEADER \
                  -config replacer.full_list(0).matchstr=Authorization \
                  -config replacer.full_list(0).replacement='Bearer ${{ steps.auth.outputs.token }}' \
                  -config replacer.full_list(0).matchregex=false" \
              -I || true
  
      - name: Quality gate — ZAP
        run: |
          HIGH=$(python3 -c "
          import json
          d = json.load(open('zap-report.json'))
          total = sum(
            1 for site in d.get('site', [])
            for alert in site.get('alerts', [])
            if alert.get('riskdesc','').startswith('High')
          )
          print(total)
          ")
          echo "High risk alerts: $HIGH"
          if [ "$HIGH" -gt 5 ]; then
            echo "GATE FAILED: $HIGH high-risk alerts detected"
            exit 1
          fi
          echo "Quality gate passed ($HIGH high alerts)"
  
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: |
            zap-report.json
            zap-report.html
            zap-report.md
          retention-days: 30
  # ─── PHASE 9 : RAPPORT GLOBAL ──────────────────────────────────
  security-summary:
    name: Security Reports Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca, docker-build, dast]
    if: always()
    steps:
      - name: Generate summary
        env:
          GITLEAKS_STATUS: ${{ needs.secret-scan.result }}
          SEMGREP_STATUS:  ${{ needs.sast.result }}
          SCA_STATUS:      ${{ needs.sca.result }}
          TRIVY_STATUS:    ${{ needs.docker-build.result }}
          ZAP_STATUS:      ${{ needs.dast.result }}
        run: |
          status_icon() {
            case "$1" in
              success)  echo "✅ Pass" ;;
              failure)  echo "❌ Fail" ;;
              skipped)  echo "⏭️ Skipped" ;;
              *)        echo "⚠️ $1" ;;
            esac
          }
  
          echo "## 🛡️ Security Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | Gitleaks | $(status_icon $GITLEAKS_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis (SAST) | Semgrep | $(status_icon $SEMGREP_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Analysis (SCA) | npm audit + OWASP DC | $(status_icon $SCA_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | Trivy | $(status_icon $TRIVY_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "| Dynamic Analysis (DAST) | OWASP ZAP | $(status_icon $ZAP_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
  
          # Overall status
          if [[ "$GITLEAKS_STATUS" == "failure" || "$SEMGREP_STATUS" == "failure" || \
                "$SCA_STATUS" == "failure" || "$TRIVY_STATUS" == "failure" || \
                "$ZAP_STATUS" == "failure" ]]; then
            echo "### ❌ Overall: PIPELINE FAILED — security issues detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Overall: PIPELINE PASSED" >> $GITHUB_STEP_SUMMARY
          fi
  
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Run #${{ github.run_number }} — ${{ github.repository }} — $(date -u '+%Y-%m-%d %H:%M UTC')_" >> $GITHUB_STEP_SUMMARY

  pdf-report:
    name: Generate PDF Security Report
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca, dast]
    if: always()
    steps:
      - name: Checkout repo (pour récupérer le script)
        uses: actions/checkout@v4          # ← remplace le curl
 
      - name: Install Python dependencies
        run: pip install reportlab
 
      - name: Download all security artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-report*'
          merge-multiple: true
          path: ./reports
 
      - name: Generate PDF
        env:
          REPORTS_DIR: ./reports
          OUTPUT_PDF:  security-report-${{ github.run_number }}.pdf
          REPO_NAME:   ${{ github.repository }}
          RUN_ID:      ${{ github.run_number }}
        run: python3 .github/scripts/generate_security_report.py   # ← chemin local
 
      - name: Upload PDF Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-pdf
          path: security-report-${{ github.run_number }}.pdf
          retention-days: 90
