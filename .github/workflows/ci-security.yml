name: CI/CD Security Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  security-events: write

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Build frontend
        run: npm run build 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: frontend/dist/
          if-no-files-found: ignore

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test 2>&1 | tee test-results.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    if: always()                        
    steps:
      - uses: actions/checkout@v4
#        with:
#          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: gitleaks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    if: always()                        
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif \
            . || true
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

  sca:
    name: Dependency Check (npm audit + OWASP DC)
    runs-on: ubuntu-latest
    if: always()                       
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: npm audit
        run: npm audit --json > npm-audit.json 2>&1 || true
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'juice-shop-ci'
          path: '.'
          format: 'HTML,JSON'
          out: 'dependency-check-report'
          args: --enableRetired
        continue-on-error: true
      - name: Quality gate — npm audit
        run: |
          CRITICAL=$(cat npm-audit.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          v=d.get('metadata',{}).get('vulnerabilities',{})
          print(v.get('critical',0))
          ")
          echo "Critical: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "GATE FAILED: $CRITICAL critical vulnerabilities"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-reports
          path: |
            npm-audit.json
            dependency-check-report/

  docker-build:
    name: Docker Build & Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build                        
    if: always()                        
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t juice-shop:${{ github.sha }} .
      - name: Run Trivy (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop:${{ github.sha }}'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: true
      - name: Run Trivy (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-report.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: true
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-report.sarif
          category: trivy
      - name: Quality gate — Trivy
        run: |
          CRITICAL=$(python3 -c "
          import json
          d=json.load(open('trivy-report.json'))
          total=sum(1 for r in d.get('Results',[]) for v in r.get('Vulnerabilities',[]) if v.get('Severity')=='CRITICAL')
          print(total)
          ")
          echo "Critical CVEs: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "GATE FAILED: $CRITICAL critical CVEs"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
      - name: Save Docker image
        if: always()
        run: docker save juice-shop:${{ github.sha }} | gzip > juice-shop.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-image
          path: juice-shop.tar.gz

  deploy-test:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest
    needs: docker-build
    if: always()                        
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load < juice-shop.tar.gz
      - name: Start application
        run: |
          docker run -d \
            --name juice-shop-test \
            -p 3000:3000 \
            juice-shop:${{ github.sha }}
          sleep 40
          curl --retry 15 --retry-delay 5 --retry-connrefused \
            http://localhost:3000 -o /dev/null -s -w "HTTP %{http_code}\n"

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: deploy-test
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-image
        continue-on-error: true

      - name: Load and start application
        run: |
          if [ ! -f juice-shop.tar.gz ]; then
            echo "ERROR: docker image artifact not found"
            exit 1
          fi
          docker load < juice-shop.tar.gz
          docker run -d --name juice-shop-dast -p 3000:3000 juice-shop:${{ github.sha }}
          echo "Waiting for app to start..."
          sleep 40
          curl --retry 15 --retry-delay 5 --retry-connrefused \
            http://localhost:3000 -o /dev/null -s -w "HTTP %{http_code}\n"

      - name: Get JWT token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:3000/rest/user/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@juice-sh.op","password":"admin123"}')
          echo "Response: $RESPONSE"
          TOKEN=$(echo $RESPONSE | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d.get('authentication',{}).get('token',''))
          ")
          if [ -z "$TOKEN" ]; then
            echo "WARNING: Could not get JWT, continuing without auth"
            TOKEN="no-token"
          fi
          echo "Token obtained: ${TOKEN:0:20}..."
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: ZAP authenticated baseline scan
        run: |
          mkdir -p zap-output
          chmod 777 zap-output

          docker run --rm \
            --network host \
            -v $(pwd)/zap-output:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:3000 \
              -r zap-report.html \
              -J zap-report.json \
              -z "-config replacer.full_list(0).description=auth \
                  -config replacer.full_list(0).enabled=true \
                  -config replacer.full_list(0).matchtype=REQ_HEADER \
                  -config replacer.full_list(0).matchstr=Authorization \
                  -config replacer.full_list(0).replacement='Bearer ${{ steps.auth.outputs.token }}' \
                  -config replacer.full_list(0).matchregex=false" \
              -I || true

          sudo chown -R $USER:$USER zap-output/ 2>/dev/null || true
          cp zap-output/zap-report.json . 2>/dev/null || true
          cp zap-output/zap-report.html . 2>/dev/null || true
          ls -la zap-report.json zap-report.html || echo "WARNING: reports missing"

      - name: Quality gate — ZAP
        run: |
          if [ ! -f zap-report.json ]; then
            echo "WARNING: zap-report.json not found, skipping quality gate"
            exit 0
          fi
          HIGH=$(python3 -c "
          import json
          d=json.load(open('zap-report.json'))
          total=sum(
            1 for site in d.get('site',[])
            for alert in site.get('alerts',[])
            if alert.get('riskdesc','').startswith('High')
          )
          print(total)
          ")
          echo "High alerts: $HIGH"
          if [ "$HIGH" -gt 5 ]; then
            echo "GATE FAILED: $HIGH high-risk alerts detected"
            exit 1
          fi
          echo "Quality gate passed ($HIGH high alerts)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            zap-report.json
            zap-report.html
          if-no-files-found: warn
          retention-days: 30      
  security-summary:
    name: Security Reports Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca, docker-build, dast]
    if: always()
    steps:
      - name: Generate summary
        env:
          GITLEAKS_STATUS: ${{ needs.secret-scan.result }}
          SEMGREP_STATUS:  ${{ needs.sast.result }}
          SCA_STATUS:      ${{ needs.sca.result }}
          TRIVY_STATUS:    ${{ needs.docker-build.result }}
          ZAP_STATUS:      ${{ needs.dast.result }}
        run: |
          status_icon() {
            case "$1" in
              success)  echo "Pass" ;;
              failure)  echo "Fail" ;;
              skipped)  echo "Skipped" ;;
              *)        echo "$1" ;;
            esac
          }
          echo "## Security Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | Gitleaks | $(status_icon $GITLEAKS_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | Semgrep | $(status_icon $SEMGREP_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA | npm audit + OWASP DC | $(status_icon $SCA_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | Trivy | $(status_icon $TRIVY_STATUS) |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST | OWASP ZAP | $(status_icon $ZAP_STATUS) |" >> $GITHUB_STEP_SUMMARY
          if [[ "$GITLEAKS_STATUS" == "failure" || "$SEMGREP_STATUS" == "failure" || \
                "$SCA_STATUS" == "failure" || "$TRIVY_STATUS" == "failure" || \
                "$ZAP_STATUS" == "failure" ]]; then
            echo "### Overall: PIPELINE FAILED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Overall: PIPELINE PASSED" >> $GITHUB_STEP_SUMMARY
          fi

  pdf-report:
    name: Generate PDF Security Report
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca, dast]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: pip install reportlab
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-report*'
          merge-multiple: true
          path: ./reports
      - name: Generate PDF
        env:
          REPORTS_DIR: ./reports
          OUTPUT_PDF:  security-report-${{ github.run_number }}.pdf
          REPO_NAME:   ${{ github.repository }}
          RUN_ID:      ${{ github.run_number }}
        run: python3 .github/scripts/generate_security_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: security-report-pdf
          path: security-report-${{ github.run_number }}.pdf
          retention-days: 90
